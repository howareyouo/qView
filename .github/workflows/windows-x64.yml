name: Build Windows x64

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022
    steps:
      - name: Set environment variables
        shell: bash
        run: echo "qtArch=win64_msvc2022_64" >> $GITHUB_ENV

      - uses: actions/checkout@v7

      - name: Read version
        shell: bash
        run: |
          version=$(sed -nE 's/^#define MyAppVersion "([0-9.]+)".*/\1/p' dist/win/qView.iss)
          echo "qvVersion=$version" >> $GITHUB_ENV
          echo "Version $version"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true
          modules: 'qtimageformats'

      - name: Build qView
        shell: pwsh
        run: dist/scripts/build.ps1 -CI

      - name: Deploy qView
        shell: pwsh
        run: |
          & dist/scripts/download-plugins.ps1
          & dist/scripts/windeployqt.ps1 -NoInstaller

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: qView-${{ env.qvVersion }}-win64
          path: bin
